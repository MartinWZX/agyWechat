# Minimal Production Configuration for Pure Two-State WeChat Gateway
system:
  app_name: "agyWechat"
  workspace_dir: "."
  db_path: "memory/agent_core.db"
  progress_push_interval_seconds: 0
  user_workspaces: {}

engines:
  primary: "agy"

  agy:
    binary: "agy"
    dangerously_skip_permissions_flag: "--dangerously-skip-permissions"
    default_model: "inherit"
    timeout_seconds: 0
    max_turns: 0

  pi:
    binary: "pi"
    dangerously_skip_permissions_flag: "--no-confirm"
    default_model: "inherit"
    timeout_seconds: 0
    max_turns: 0

  claude:
    binary: "claude"
    dangerously_skip_permissions_flag: "--dangerously-skip-permissions"
    default_model: "inherit"
    timeout_seconds: 0
    max_turns: 0

  omp:
    binary: "omp"
    dangerously_skip_permissions_flag: "--dangerously-skip-permissions --yes"
    default_model: "inherit"
    timeout_seconds: 0
    max_turns: 0
